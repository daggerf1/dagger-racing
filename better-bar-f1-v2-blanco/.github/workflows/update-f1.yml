name: Actualizar clasificación F1
on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run update:f1
      - name: Guardar cambios
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "dagger-f1-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/f1-*.json
          git commit -m "chore: actualizar clasificación F1"
          git push
